name: benchmark

on: [push]

jobs:
  benchmark:
    runs-on: [adn]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate TB
        run: |
          unzip -P '${{ secrets.UNZIP_PASSWORD }}' source/archive.zip
          mv tb.sv source/tb.sv
          cat source/simple_cache.sv || mv tmp_simple_cache.sv source/simple_cache.sv
      
      - name: Build and Run Simulation
        run: |
          rm -rf build
          mkdir build
          cd build
          xvlog -sv ../source/*.sv
          xelab tb -s tb -debug all
          xsim tb -runall > ../ci_log.txt

      - name: Upload Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci_log.txt

      - name: Clean up
        run: |
          rm -rf build
          rm -rf source/tb.sv
          rm -rf tmp_simple_cache.sv