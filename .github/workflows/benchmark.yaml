name: benchmark

on: [push]

jobs:
  benchmark:
    runs-on: [adn]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate TB
        run: |
          unzip -P '${{ secrets.UNZIP_PASSWORD }}' source/archive.zip
          mv tb.sv source/tb.sv
          cat source/simple_cache.sv || mv tmp_simple_cache.sv source/simple_cache.sv
      
      - name: Build and Run Simulation
        run: |
          VIVADO_SETTINGS=$(find / -name settings64.sh 2>/dev/null | head -n 1)
          if [ -z "$VIVADO_SETTINGS" ]; then
            echo "Error: Vivado settings64.sh file not found!"
            exit 1
          fi
          echo "Found Vivado at: $VIVADO_SETTINGS"
          source $VIVADO_SETTINGS

          rm -rf build
          mkdir build
          cd build
          xvlog -sv ../source/*.sv
          xelab tb -s tb -debug all
          xsim tb -runall

      - name: Clean up
        run: |
          rm -rf build
          rm -rf source/tb.sv
          rm -rf tmp_simple_cache.sv
